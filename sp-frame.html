<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワールド寺子屋プログラム2026｜スマートフォン表示</title>
<meta name="robots" content="noindex">
<style>
  html,body{height:100%;margin:0}
  body{
    background:#1A0508;color:#F5EFE6;
    display:grid;place-items:center;
    font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  }
  /* iPhone 14 の実寸（390 × 844）。画面が低いときは高さだけ詰める */
  .phone{width:390px;height:min(844px,calc(100vh - 92px))}
  .phone iframe{
    width:100%;height:100%;border:0;display:block;border-radius:34px;background:#1A0508;
    box-shadow:0 0 0 10px #241014,0 0 0 11px rgba(245,239,230,.16),0 30px 90px rgba(0,0,0,.6);
  }
  .note{position:fixed;left:0;right:0;bottom:20px;margin:0;text-align:center;
        font-size:12px;letter-spacing:.08em;opacity:.5}
</style>
</head>
<body>
<div class="phone">
  <iframe src="index.html?sp=1" title="ワールド寺子屋プログラム2026（スマートフォン表示）"></iframe>
</div>
<p class="note">スマートフォン表示（390 × 844）</p>
<script>
/* 窓を狭めてスマホ幅になったら、枠を外して本体へ戻す。
   index.html 側は 768px 以上のときだけこの頁へ送るので、行き来のループにはならない。 */
(function(){
  var back=function(){ if(window.innerWidth<768) location.replace('index.html'); };
  back();
  window.addEventListener('resize',back);
})();
</script>
</body>
</html>
